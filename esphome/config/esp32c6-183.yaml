substitutions:
  name: "matchbox"
  friendly_name: "matchbox"
  device_description: "ESP32C6 1.83 rectangular"
  project_name: "black.mathbox"
  project_version: "1.0.0"

packages:
  display: !include modules/display.yaml
  touchscreen: !include modules/touchscreen.yaml
  wifi: !include modules/wifi.yaml


esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  project:
    name: "${project_name}"
    version: "${project_version}"

esp32:
  board: "esp32-c6-devkitc-1"
  variant: "ESP32C6"
  framework:
    type: esp-idf
  flash_size: 16MB
      
logger:

api:
  encryption: 
    key: "u+41i0Pc7daBCsVaw+CzkhVsliyp9NM20HMDDFkeSO4="

ota:
  - platform: esphome

spi:
  clk_pin: 1  # Adjust to your wiring
  mosi_pin: 2

i2c:
  sda: 7
  scl: 8
  id: touchscreen_bus

font:
  - file: "gfonts://Roboto"
    id: my_font
    size: 40

web_server:
  port: 80

lvgl:
  # on_idle:
  #   - timeout: 30s
  #     then:
  #       - lvgl.pause:
  #           show_snow: true

  buffer_size: 25%

  displays:
    - my_display
  
  theme:
    label:
      text_font: my_font # set all your labels to use your custom defined font
    button:
      bg_color: 0x2F8CD8
      bg_grad_color: 0x005782
      bg_grad_dir: VER
      bg_opa: COVER
      border_color: 0x0077b3
      border_width: 1
      text_color: 0xFFFFFF
      pressed: # set some button colors to be different in pressed state
        bg_color: 0x006699
        bg_grad_color: 0x00334d
      checked: # set some button colors to be different in checked state
        bg_color: 0x1d5f96
        bg_grad_color: 0x03324A
        text_color: 0xfff300
    buttonmatrix:
      bg_opa: TRANSP
      border_color: 0x0077b3
      border_width: 0
      text_color: 0xFFFFFF
      pad_all: 0
      items: # set all your buttonmatrix buttons to use your custom defined styles and font
        bg_color: 0x2F8CD8
        bg_grad_color: 0x005782
        bg_grad_dir: VER
        bg_opa: COVER
        border_color: 0x0077b3
        border_width: 1
        text_color: 0xFFFFFF
        text_font: my_font
        pressed:
          bg_color: 0x006699
          bg_grad_color: 0x00334d
        checked:
          bg_color: 0x1d5f96
          bg_grad_color: 0x03324A
          text_color: 0x005580
    switch:
      bg_color: 0xC0C0C0
      bg_grad_color: 0xb0b0b0
      bg_grad_dir: VER
      bg_opa: COVER
      checked:
        bg_color: 0x1d5f96
        bg_grad_color: 0x03324A
        bg_grad_dir: VER
        bg_opa: COVER
      knob:
        bg_color: 0xFFFFFF
        bg_grad_color: 0xC0C0C0
        bg_grad_dir: VER
        bg_opa: COVER
    slider:
      border_width: 1
      border_opa: 15%
      bg_color: 0xcccaca
      bg_opa: 15%
      indicator:
        bg_color: 0x1d5f96
        bg_grad_color: 0x03324A
        bg_grad_dir: VER
        bg_opa: COVER
      knob:
        bg_color: 0x2F8CD8
        bg_grad_color: 0x005782
        bg_grad_dir: VER
        bg_opa: COVER
        border_color: 0x0077b3
        border_width: 1
        text_color: 0xFFFFFF
  style_definitions:
    - id: header_footer
      bg_color: 0x2F8CD8
      bg_grad_color: 0x005782
      bg_grad_dir: VER
      bg_opa: COVER
      border_opa: TRANSP
      radius: 0
      pad_all: 0
      pad_row: 0
      pad_column: 0
      border_color: 0x0077b3
      text_color: 0xFFFFFF
      width: 100%
      height: 30

  top_layer:
    widgets:
      - buttonmatrix:
          align: bottom_mid
          styles: header_footer
          pad_all: 0
          outline_width: 0
          id: top_layer
          items:
            styles: header_footer
          rows:
            - buttons:
              - id: page_prev
                text: "\uF053"
                on_press:
                  then:
                    lvgl.page.previous:
              - id: page_home
                text: "\uF015"
                on_press:
                  then:
                    lvgl.page.show: page_1
              - id: page_next
                text: "\uF054"
                on_press:
                  then:
                    lvgl.page.next:

  pages:
    # Page 1
    - id: page_1
      width: 100%
      widgets:
        - obj:
            id: background_1
            x: 0
            y: 0
            width: 240
            height: 284
            bg_color: 0x000000
            border_width: 0
            pad_all: 0
            clickable: true

        - label:
            id: page_1_label
            text: "Page 1"
            align: center

      on_swipe_left:
          - lvgl.page.show:
              id: page_2
              animation: NONE

      on_swipe_right:
        - lvgl.page.show:
            id: page_2
            animation: NONE

    # Page 2
    - id: page_2
      widgets:
        - obj:
            id: background_2
            x: 0
            y: 0
            width: 240
            height: 284
            bg_color: 0x000000
            border_width: 0
            pad_all: 0
            clickable: true

        - label:
            id: page_2_label
            text: "Page 2"
            align: center

      on_swipe_left:
          - lvgl.page.show:
              id: page_1
              animation: NONE

      on_swipe_right:
        - lvgl.page.show:
            id: page_1
            animation: NONE

